[workspace]
resolver = "2"
members = [
    "crates/flint-messenger",
    "crates/flint-tor-arti",
    "crates/flint-gateway",
    "crates/flint-messenger-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["DanilaGrinRus <DanilaGrinRus@users.noreply.github.com>"]
repository = "https://github.com/DanilaGrinRus/GrinMessenger"
description = "GrinMessenger: standalone Grin messenger over Tor/Arti (signed encrypted envelopes, direct onion delivery and store-and-forward relay); extracted from Flint messenger"

[profile.dev]
# No native debug info: MSVC's -Z7 chokes on long paths in this deep dependency
# graph, and the messenger is tested through unit/integration tests anyway.
debug = 0

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
