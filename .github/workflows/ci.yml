name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (pinned for reproducible clippy/fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: tests
        run: cargo test --workspace --locked
      - name: real relay process test
        if: runner.os == 'Linux'
        run: cargo test -p flint-gateway --test relay_live --locked -- --ignored --test-threads=1

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # Two advisories come from arti's transitive ssh-key-fork -> rsa 0.9.10
      # path (no patched rsa release exists). They are documented with rationale
      # in docs/SECURITY.md; RSA is used for SSH key parsing, not wallet RSA.
      - name: cargo audit
        run: >
          cargo audit --file Cargo.lock
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0387
