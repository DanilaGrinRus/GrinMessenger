[package]
name = "flint-messenger-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Two-peer CLI demo for the standalone Flint messenger over direct Tor (Arti) or a relay"

[dependencies]
flint-messenger = { path = "../flint-messenger" }
flint-gateway = { path = "../flint-gateway" }
flint-tor-arti = { path = "../flint-tor-arti" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
getrandom = "0.2"
thiserror = "2"

[[bin]]
name = "flintmsg"
path = "src/main.rs"
